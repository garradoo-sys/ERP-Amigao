<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oficina360 ERP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-brand">
      <div class="brand-mark">O</div>
      <div><h1>Oficina360</h1><p>Gestão completa para oficina e autopeças</p></div>
    </div>
    <form id="loginForm" class="login-card">
      <div class="login-heading"><span>ACESSO SEGURO</span><h2>Entrar no sistema</h2><p>Use seu usuário e senha para continuar.</p></div>
      <label class="field"><span>Usuário ou e-mail</span><input id="loginUser" autocomplete="username" required placeholder="admin"></label>
      <label class="field"><span>Senha</span><div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"><button type="button" class="eye" data-toggle="loginPassword">👁</button></div></label>
      <label class="remember"><input id="rememberMe" type="checkbox"> Manter conectado neste computador</label>
      <p id="loginError" class="login-error"></p>
      <button class="btn login-btn">Entrar</button>
      <div class="demo-access"><b>Primeiro acesso</b><span>Usuário: <strong>admin</strong></span><span>Senha: <strong>admin123</strong></span></div>
    </form>
  </section>

  <div id="erpView" class="erp-view hidden">
    <aside class="sidebar">
      <div class="logo"><div class="mark">O</div><div><b>Oficina360</b><small>Gestão automotiva</small></div></div>
      <nav id="nav"></nav>
      <div class="side-foot"><span>Empresa demonstrativa</span><b>Auto Center Brasil</b></div>
    </aside>
    <main>
      <header>
        <div><button id="menuBtn" class="menu">☰</button><h1 id="title">Visão geral</h1><p id="subtitle">Acompanhe sua oficina em tempo real</p></div>
        <div class="head-actions">
          <div class="search">⌕ <input id="globalSearch" placeholder="Buscar cliente, placa, produto..."></div>
          <button class="icon" title="Notificações">🔔</button>
          <button id="userMenuBtn" class="user-chip"><span id="headerAvatar" class="avatar">AD</span><span><b id="headerUser">Administrador</b><small id="headerRole">Administrador</small></span>⌄</button>
          <div id="userMenu" class="user-menu"><button id="myAccountBtn">👤 Minha conta</button><button id="logoutBtn" class="logout">↪ Sair</button></div>
        </div>
      </header>
      <section id="app"></section>
    </main>
  </div>

  <div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" onclick="closeModal()">×</button></div><form id="modalForm"></form></div></div>
  <script src="app.js"></script>
</body>
</html>
