services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amigao_erp
      POSTGRES_USER: amigao
      POSTGRES_PASSWORD: amigao123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigao -d amigao_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://amigao:amigao123@db:5432/amigao_erp
      JWT_SECRET: altere-esta-chave-em-producao
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
